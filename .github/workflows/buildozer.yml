name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        env:
          # Эти переменные отключают некоторые интерактивные запросы (например, лицензии SDK)
          BUILDOZER_ALLOW_ROOT: 1
          BUILDOZER_ACCEPT_SDK_LICENSE: 1
        run: |
          # Исправление прав доступа для корректной работы buildozer
          chown -R root:root .
          
          # Запуск сборки с автоматическим ответом 'y' на запрос "Are you sure you want to continue [y/n]?"
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marathon-app-apk
          path: bin/*.apk
