name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force Python 3.11 in buildozer.spec
        run: |
          sed -i '/^python_version =/d' buildozer.spec
          sed -i '/^\[app\]/a python_version = 3.11' buildozer.spec
          echo "=== buildozer.spec после фикса ==="
          grep "python_version" buildozer.spec

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: 1
          BUILDOZER_ACCEPT_SDK_LICENSE: 1
        run: |
          chown -R root:root .
          yes | buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marathon-app-apk
          path: bin/*.apk
