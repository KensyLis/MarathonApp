name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure Python 3.11 in buildozer.spec
        run: |
          # Если в buildozer.spec нет python_version, добавляем
          if ! grep -q "^python_version" buildozer.spec; then
            echo "python_version = 3.11" >> buildozer.spec
          else
            sed -i 's/^python_version =.*/python_version = 3.11/' buildozer.spec
          fi
          echo "=== buildozer.spec (python_version line) ==="
          grep "python_version" buildozer.spec || echo "python_version not found"

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build with Buildozer
        env:
          BUILDOZER_ALLOW_ROOT: 1
          BUILDOZER_ACCEPT_SDK_LICENSE: 1
        run: |
          chown -R root:root .
          yes | buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marathon-app-apk
          path: bin/*.apk
